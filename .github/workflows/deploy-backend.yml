name: Deploy Platform Backends

on:
  push:
    branches:
      - main
    paths:
      - 'a5markets/**'
      - 'novafxm/**'
      - 'veltriumfx/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Run VPS deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/platform_deploy_key
          chmod 600 ~/.ssh/platform_deploy_key
          ssh -i ~/.ssh/platform_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "/root/deploy-platform.sh"
